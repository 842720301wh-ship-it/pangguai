plugins { id 'com.android.application' }
def packageMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
android {
    namespace 'com.panguai.account'
    compileSdk 36
    defaultConfig {
        applicationId 'com.panguai.account'
        minSdk 26
        targetSdk 36
        versionCode(packageMetadata.panguai.androidVersionCode as int)
        versionName packageMetadata.version
        resValue 'string', 'app_name', packageMetadata.panguai.displayName
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.9.3'
}
